services:
  mongo:
    image: mongo:7
    container_name: homelab-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./Backend
    container_name: homelab-backend
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - ./Backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/homelab
    ports:
      - "5000:5000"

  frontend:
    build: ./Frontend
    container_name: homelab-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mongo-data:
