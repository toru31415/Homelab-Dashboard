server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Alle API-Aufrufe an den Backend-Container weiterleiten.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React-Router: alle unbekannten Pfade auf index.html umleiten.
    location / {
        try_files $uri /index.html;
    }
}